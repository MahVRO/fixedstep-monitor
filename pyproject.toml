[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fixedstep-monitor"
version = "0.2.0"
description = "Quote-only MT5 monitoring and chart export for FixedStep0.5"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0; platform_system == 'Windows'"]

[project.scripts]
fixedstep-monitor = "fixedstep_monitor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
